<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head><body>
<div class="wrap">
<header class="top"><span class="brand"><i></i>Studio</span><div class="row"><span id="who" class="pill" hidden></span><button id="out" class="btn ghost" hidden>Sign out</button></div></header>

<main id="login" class="admin" style="max-width:480px">
<div class="panel"><h2>Sign in</h2>
<p class="desc" style="margin:0 0 16px">Enter the admin email. We send a sign-in link and a code. Use either.</p>
<div class="grid2" style="grid-template-columns:1fr"><label>Email<input id="em" type="email" autocomplete="email" placeholder="you@example.com"></label>
<button id="send" class="btn">Send link and code</button>
<label id="codeBox" hidden>Code from the email<input id="code" inputmode="numeric" autocomplete="one-time-code"></label>
<button id="verify" class="btn ghost" hidden>Verify code</button></div>
<p id="lmsg" class="msg"></p></div>
</main>

<main id="dash" class="admin" hidden>
<section class="panel"><h2 id="ftitle">New app</h2>
<form id="f" class="grid2">
<label>App name<input id="name" required maxlength="80"></label>
<label>Package name<input id="package" required value="com.arina.assistant"></label>
<label>Date<input id="released_on" type="date" required></label>
<label>Model<input id="model" placeholder="e.g. Voice agent"></label>
<label>Version<input id="version" placeholder="e.g. 9 Lumen"></label>
<label>Icon image link (https, optional)<input id="icon_url" type="url" placeholder="https://..."></label>
<label class="full">Description<textarea id="description"></textarea></label>
<label class="full">Android build link (https)<input id="android_url" type="url" placeholder="https://.../App.apk"></label>
<label class="full">iOS build link (leave empty for Coming soon)<input id="ios_url" type="url" placeholder="https://..."></label>
<div class="full row"><button class="btn" type="submit" id="pub">Publish</button><button class="btn ghost" type="button" id="reset">Clear</button><span id="fmsg" class="msg"></span></div>
</form></section>
<section class="panel"><h2>Your apps</h2><div id="items"></div></section>
</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
var sb=supabase.createClient("https://xzwlhegzneeujlpbjjba.supabase.co","sb_publishable_zIbBj3vtEGB5inLQDJGrAw_pwD4fVB-",{auth:{persistSession:true,detectSessionInUrl:true,flowType:"implicit"}});
var $=function(i){return document.getElementById(i)};
var FIELDS=["name","package","released_on","model","version","icon_url","description","android_url","ios_url"];
var editing=null,rows=[];
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function say(el,t,k){el.textContent=t||"";el.className="msg "+(k||"")}
function clearForm(){editing=null;$("f").reset();$("package").value="com.arina.assistant";$("released_on").value=today();$("ftitle").textContent="New app";$("pub").textContent="Publish";say($("fmsg"),"")}
async function gate(){
var s=(await sb.auth.getSession()).data.session;
if(!s){show(false);return}
var r=await sb.rpc("is_admin");
if(r.error||r.data!==true){await sb.auth.signOut();show(false);say($("lmsg"),"This account is not allowed here.","err");return}
$("who").textContent=s.user.email;$("who").hidden=false;$("out").hidden=false;show(true);clearForm();list();
}
function show(ok){$("dash").hidden=!ok;$("login").hidden=ok;if(!ok){$("who").hidden=true;$("out").hidden=true}}
async function list(){
var r=await sb.from("site_apps").select("*").order("created_at",{ascending:false});
if(r.error){$("items").innerHTML='<p class="note">Could not load.</p>';return}
rows=r.data;
$("items").innerHTML=rows.length?rows.map(function(a){return '<div class="item"><div><strong>'+esc(a.name)+'</strong> <span class="pill '+(a.published?"on":"")+'">'+(a.published?"Live":"Hidden")+'</span><div class="meta"><span>'+esc(a.package)+'</span><span>'+esc(a.version)+'</span></div></div><div class="row"><button class="btn ghost" data-e="'+a.id+'">Edit</button><button class="btn ghost" data-t="'+a.id+'">'+(a.published?"Hide":"Show")+'</button><button class="btn ghost" data-d="'+a.id+'">Delete</button></div></div>'}).join(""):'<p class="note">No apps yet.</p>';
}
function httpsOnly(v){v=v.trim();return v===""||/^https:\/\//i.test(v)}
$("f").addEventListener("submit",async function(e){
e.preventDefault();var o={};FIELDS.forEach(function(k){o[k]=$(k).value.trim()});
if(!httpsOnly(o.android_url)||!httpsOnly(o.ios_url)||!httpsOnly(o.icon_url)){say($("fmsg"),"Links must start with https://","err");return}
say($("fmsg"),"Saving...");
var r=editing?await sb.from("site_apps").update(o).eq("id",editing):await sb.from("site_apps").insert(o);
if(r.error){say($("fmsg"),"Could not save. "+r.error.message,"err");return}
say($("fmsg"),editing?"Updated.":"Published.","ok");var m=$("fmsg").textContent;clearForm();say($("fmsg"),m,"ok");list();
});
$("reset").onclick=clearForm;
$("items").addEventListener("click",async function(e){
var b=e.target.closest("button");if(!b)return;
var id=b.dataset.e||b.dataset.t||b.dataset.d,a=rows.find(function(x){return x.id===id});if(!a)return;
if(b.dataset.e){editing=id;FIELDS.forEach(function(k){$(k).value=a[k]||""});$("ftitle").textContent="Edit "+a.name;$("pub").textContent="Save changes";window.scrollTo({top:0,behavior:"smooth"})}
else if(b.dataset.t){await sb.from("site_apps").update({published:!a.published}).eq("id",id);list()}
else if(b.dataset.d){if(b.dataset.armed){await sb.from("site_apps").delete().eq("id",id);list()}else{b.dataset.armed="1";b.textContent="Tap again to delete"}}
});
$("send").onclick=async function(){
var em=$("em").value.trim();if(!em){say($("lmsg"),"Enter your email.","err");return}
say($("lmsg"),"Sending...");
var r=await sb.auth.signInWithOtp({email:em,options:{shouldCreateUser:false,emailRedirectTo:location.origin+location.pathname}});
if(r.error){say($("lmsg"),"Could not send. Check the email and try again.","err");return}
say($("lmsg"),"Sent. Open the link, or type the code below.","ok");$("codeBox").hidden=false;$("verify").hidden=false;
};
$("verify").onclick=async function(){
var r=await sb.auth.verifyOtp({email:$("em").value.trim(),token:$("code").value.trim(),type:"email"});
if(r.error){say($("lmsg"),"That code did not work.","err");return}
gate();
};
$("out").onclick=async function(){await sb.auth.signOut();show(false);say($("lmsg"),"")};
sb.auth.onAuthStateChange(function(ev){if(ev==="SIGNED_IN")gate()});
gate();
})();
</script>
</body></html>
