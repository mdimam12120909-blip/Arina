name: Build Arina APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Write API keys from repository secrets
        run: |
          {
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}"
            echo "CARTESIA_API_KEY=${{ secrets.CARTESIA_API_KEY }}"
            echo "CARTESIA_VOICE_ID=${{ secrets.CARTESIA_VOICE_ID }}"
            echo "TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}"
          } > local.properties

      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --no-daemon > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "^e: |error:|Execution failed|What went wrong|Unresolved|Could not " build.log | head -25 | sed 's#/home/runner/work/[^/]*/[^/]*/##' | while IFS= read -r line; do echo "::error::${line}"; done
          fi
          exit $code

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Arina.apk
          gh release create "build-${{ github.run_number }}" Arina.apk \
            --title "Arina build ${{ github.run_number }}" \
            --notes "Download Arina.apk on your Android phone and install it."
